# Nginx site configuration for tamalslab.in
# ------------------------------------------------------------------------------
# • tamalslab.in / www.tamalslab.in  → Next.js portfolio on 127.0.0.1:3000
# • api.tamalslab.in                 → existing Node.js API on 127.0.0.1:5000
#
# This is the HTTP-only starting point. After DNS points at the server, run
# Certbot (see README) and it will add the HTTPS server blocks and redirects.
#
# If an Nginx config for the API already exists on the server, keep that one
# and remove the `api.tamalslab.in` block below to avoid a duplicate server_name.
# ------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name tamalslab.in www.tamalslab.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tamalslab.in;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
